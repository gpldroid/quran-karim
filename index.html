<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WOW — بوابة لوحة التحكم</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#080d18;color:#f8fafc;display:grid;place-items:center}
.wrap{width:min(92%,560px);padding:24px}.card{padding:34px;border:1px solid #263247;border-radius:24px;background:#111827;box-shadow:0 24px 70px #0008;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);font-size:28px;font-weight:900}
h1{margin:0 0 10px;font-size:30px}p{margin:0 auto 26px;color:#94a3b8;line-height:1.8}.actions{display:grid;gap:12px}
a{display:block;padding:14px 18px;border-radius:14px;text-decoration:none;font-weight:800;border:1px solid #334155;color:#e2e8f0;background:#172033}
a.primary{border-color:#2563eb;background:#2563eb;color:#fff}a:hover{filter:brightness(1.08)}small{display:block;margin-top:20px;color:#64748b}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="logo">W</div>
<h1>WOW Dashboard</h1>
<p>بوابة الوصول إلى لوحة التحكم وإدارة المحتوى والتصنيفات وإعدادات المنصة.</p>
<div class="actions">
<a class="primary" href="/wow/dashboard/">دخول لوحة التحكم</a>
<a href="/wow/login/">تسجيل الدخول</a>
<a href="/wow/">فتح الموقع</a>
</div>
<small>WOW Platform · Web + Android + Supabase</small>
</section></main>
</body>
</html>
