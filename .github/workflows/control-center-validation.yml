name: Control Center Validation

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-center-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web Control Center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /quran-karim
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify static export
        run: |
          test -f apps/web/out/index.html
          test -d apps/web/out/admin
          echo "Static export verified."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-center-web-${{ github.sha }}
          path: apps/web/out
          if-no-files-found: error
          retention-days: 14
