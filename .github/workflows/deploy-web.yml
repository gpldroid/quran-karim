name: Deploy Web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Restore Node.js and Next.js caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            apps/web/.next/cache
          key: ${{ runner.os }}-node22-next15-${{ hashFiles('package.json', 'apps/web/package.json', 'apps/web/package-lock.json', 'apps/web/npm-shrinkwrap.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-next15-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static Next.js site
        working-directory: apps/web
        run: npm run build
      - name: Verify static export
        working-directory: apps/web
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
