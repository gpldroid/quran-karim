name: Build Android APK and Release
on: {workflow_dispatch: {inputs: {version: {required: true, default: v1.0.0}}}}
permissions: {contents: write}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: |
      test -f android/gradlew
      chmod +x android/gradlew
      android/gradlew -p android assembleRelease
   - id: apk
     run: echo "path=$(find android -type f -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"
   - name: Release
     env: {GH_TOKEN: ${{ github.token }}}
     run: gh release create "${{ inputs.version }}" "${{ steps.apk.outputs.path }}" --title "${{ inputs.version }}" --generate-notes
   - name: Update Supabase
     env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
     run: |
      curl -fsS -X POST "$SUPABASE_URL/rest/v1/app_artifacts" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d "{"version":"${{ inputs.version }}","download_url":"https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}","release_notes":"GitHub Release ${{ inputs.version }}"}"