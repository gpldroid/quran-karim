name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options:
          - preview
          - production
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/eas-build.yml"

jobs:
  build:
    name: Build Android with EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link EAS project
        run: eas init --force --non-interactive

      - name: Build Android
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
