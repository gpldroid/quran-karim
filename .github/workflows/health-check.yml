name: System Health Check
on:
  schedule:
    - cron: "0 06 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages website
        id: website
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://gpldroid.github.io/quran-karim/")"
          test "$HTTP_STATUS" -ge 200
          test "$HTTP_STATUS" -lt 400
      - name: Check Supabase REST API
        id: supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/app_builds?select=id&limit=1")"
          test "$HTTP_STATUS" -ge 200
          test "$HTTP_STATUS" -lt 400
      - name: Send Telegram failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSITE_RESULT: ${{ steps.website.outcome }}
          SUPABASE_RESULT: ${{ steps.supabase.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MESSAGE="Quran Karim health check failed. Website: $WEBSITE_RESULT. Supabase: $SUPABASE_RESULT. Run: $RUN_URL"
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 \
            --request POST \
            --url "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id:$chat_id,text:$text,disable_web_page_preview:true}')"
