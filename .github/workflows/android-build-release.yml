name: Android Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        required: false
        type: string
      version_code:
        required: false
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          CODE="${{ inputs.version_code }}"
          NAME="${{ inputs.version_name }}"
          if [ -z "$CODE" ]; then CODE="$GITHUB_RUN_NUMBER"; fi
          if [ -z "$NAME" ]; then NAME="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: gradle -p android assembleRelease -PversionCode="${{ steps.version.outputs.code }}" -PversionName="${{ steps.version.outputs.name }}" --no-daemon
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: quran-karim-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" --title "Quran Karim $TAG" --generate-notes
      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken()
            core.setOutput("token", token)
      - name: Sync release to Supabase
        env:
          RELEASE_SYNC_URL: https://tqmjueqdfdyhiukhbant.supabase.co/functions/v1/release-sync
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          ASSET="${{ steps.apk.outputs.name }}"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          curl --fail-with-body --retry 4 --retry-delay 2 --max-time 30             -X POST "$RELEASE_SYNC_URL"             -H "content-type: application/json"             -H "x-release-secret: $RELEASE_SYNC_SECRET"             -d "{"version_code":${{ steps.version.outputs.code }},"version_name":"${{ steps.version.outputs.name }}","release_tag":"$TAG","release_url":"$RELEASE_URL","download_url":"$DOWNLOAD_URL","artifact_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID","github_run_id":$GITHUB_RUN_ID,"status":"published"}"
