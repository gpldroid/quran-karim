name: Android Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        required: false
        type: string
      version_code:
        required: false
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          CODE="${{ inputs.version_code }}"
          NAME="${{ inputs.version_name }}"
          if [ -z "$CODE" ]; then CODE="$GITHUB_RUN_NUMBER"; fi
          if [ -z "$NAME" ]; then NAME="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: gradle -p android assembleRelease -PversionCode="${{ steps.version.outputs.code }}" -PversionName="${{ steps.version.outputs.name }}" --no-daemon
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: quran-karim-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          APK="${{ steps.apk.outputs.path }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "Quran Karim $TAG" --generate-notes
          fi
      - name: Sync release to Supabase
        env:
          RELEASE_SYNC_URL: https://tqmjueqdfdyhiukhbant.supabase.co/functions/v1/release-sync
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          curl --fail-with-body --retry 4 --retry-delay 2 --max-time 30 -X POST "$RELEASE_SYNC_URL" -H "content-type: application/json" -d "{\"tag\":\"$TAG\"}"
