name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name"
        required: false
        default: "1.0.0"
      version_code:
        description: "Android version code"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          CODE="${{ inputs.version_code }}"
          NAME="${{ inputs.version_name }}"
          if [ -z "$CODE" ]; then CODE="$GITHUB_RUN_NUMBER"; fi
          if [ -z "$NAME" ]; then NAME="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: |
          gradle -p android :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-karim-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          APK="${{ steps.apk.outputs.path }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "Quran Karim $TAG" --generate-notes
          fi
      - name: Sync release to Supabase
        env:
          RELEASE_SYNC_URL: https://tqmjueqdfdyhiukhbant.supabase.co/functions/v1/release-sync
          RELEASE_SYNC_SECRET: ${{ secrets.SUPABASE_RELEASE_SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          curl --fail-with-body --retry 4 --retry-delay 2 --max-time 30 \
            -X POST "$RELEASE_SYNC_URL" \
            -H "content-type: application/json" \
            -H "x-release-secret: $RELEASE_SYNC_SECRET" \
            -d "{\"version_code\":${{ steps.version.outputs.code }},\"version_name\":\"${{ steps.version.outputs.name }}\",\"release_tag\":\"$TAG\",\"release_url\":\"https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG\",\"download_url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ steps.apk.outputs.name }}\",\"artifact_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"status\":\"published\",\"github_run_id\":$GITHUB_RUN_ID}"
