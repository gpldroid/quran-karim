name: Web Validation
on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - "dashboard/**"
      - ".github/workflows/web.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm install
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
