name: Web Pages Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://npytwojnxsmxhcssajtg.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_s9DgcPj_TJh-ZbVhPqgnvw_opH6Z5ww' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/package.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-
      - name: Prepare Next.js cache directory
        run: mkdir -p .next/cache
      - name: Install
        run: npm install
      - name: Verify Supabase configuration
        working-directory: .
        run: |
          set -e
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          echo "Supabase configuration: OK"
      - name: Generate public runtime Supabase configuration
        working-directory: web
        run: |
          node -e 'require("fs").writeFileSync("public/runtime-config.js", "window.WOW_SUPABASE_CONFIG="+JSON.stringify({url:process.env.SUPABASE_URL,anonKey:process.env.SUPABASE_ANON_KEY})+";\\n")'
      - name: Build static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /wow
        run: npm run build
      - name: Copy unified public shell
        run: cp public/quran.html out/index.html
      - name: Verify Supabase configuration is embedded
        working-directory: .
        run: |
          set -e
          test -d web/out
          grep -R -F -q -- "$SUPABASE_URL" web/out
          grep -R -F -q -- "$SUPABASE_ANON_KEY" web/out
          echo "Supabase configuration: embedded in static build"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
