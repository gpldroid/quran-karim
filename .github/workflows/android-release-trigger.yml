name: Temporary Android Release Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: contains(github.event.issue.title, 'BUILD-ANDROID-NOW')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Android and wait for EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
      - name: Resolve build
        id: resolve
        run: |
          set -e
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)
          test -n "$BUILD_ID" && test "$BUILD_ID" != "null"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          eas build:view "$BUILD_ID" --json > eas-build-view.json
          jq -e '(.status == "FINISHED") or (.status == "finished")' eas-build-view.json
      - name: Download APK
        env:
          BUILD_ID: ${{ steps.resolve.outputs.BUILD_ID }}
        run: |
          set -e
          eas build:download --build-id "$BUILD_ID" --non-interactive
          APK=$(find . -maxdepth 2 -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" wow.apk
          test -s wow.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-android-apk
          path: mobile/wow.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.resolve.outputs.BUILD_ID }}
        run: |
          TAG="android-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" wow.apk --repo "${GITHUB_REPOSITORY}" --title "WOW Android v1.0.${GITHUB_RUN_NUMBER}" --notes "Android APK built from EAS. EAS build: $BUILD_ID" --latest
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed
