name: Maintenance and Cleanup
on:
  schedule:
    - cron: "11 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cleanup expired cache and old release rows
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          BASE="$SUPABASE_URL/rest/v1"
          HEADERS=(-H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY")
          curl --fail --silent --show-error -X DELETE "${HEADERS[@]}" "$BASE/islamway_cache?expires_at=lt.$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent --show-error "${HEADERS[@]}" "$BASE/app_releases?select=id,created_at&order=created_at.desc&limit=100" -o /tmp/releases.json
          jq -r '.[5:] | .[].id' /tmp/releases.json | while read -r id; do
            [ -z "$id" ] && continue
            curl --fail --silent --show-error -X DELETE "${HEADERS[@]}" "$BASE/app_releases?id=eq.$id"
          done
          echo "Cleanup complete; kept the 5 newest app_releases rows."
