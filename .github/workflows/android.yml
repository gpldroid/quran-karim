name: Android EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Android with EAS and wait
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > eas-build.json

      - name: Resolve completed EAS build
        id: resolve
        run: |
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)
          test -n "$BUILD_ID" && test "$BUILD_ID" != "null"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          eas build:view "$BUILD_ID" --json > eas-build-view.json
          APK_URL=$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' eas-build-view.json)
          test -n "$APK_URL"
          echo "APK_URL=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download final APK
        run: |
          curl -fL "${{ steps.resolve.outputs.APK_URL }}" -o wow.apk
          test -s wow.apk
          file wow.apk

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.resolve.outputs.BUILD_ID }}
        run: |
          TAG="android-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" wow.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "WOW Android v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Android APK built from EAS. EAS build: $BUILD_ID" \
            --latest
