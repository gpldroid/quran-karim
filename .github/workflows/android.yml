name: Native Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "web/public/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: native-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK, release APK and AAB
        working-directory: android
        run: |
          gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify generated packages
        run: |
          set -e
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Debug APK: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          echo "Release APK (unsigned): $(du -h android/app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)"
          echo "Release AAB: $(du -h android/app/build/outputs/bundle/release/app-release.aab | cut -f1)"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: wow-native-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-native-v1.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             android/app/build/outputs/apk/debug/app-debug.apk             android/app/build/outputs/apk/release/app-release-unsigned.apk             android/app/build/outputs/bundle/release/app-release.aab             --repo "${GITHUB_REPOSITORY}"             --title "WOW Native Android v1.1.${GITHUB_RUN_NUMBER}"             --notes "Native Android/Gradle build. No Expo or EAS is used."
