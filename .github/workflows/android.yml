name: Native Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "web/public/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: native-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          CLEANED_B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          case $((${#CLEANED_B64} % 4)) in
            2) CLEANED_B64="${CLEANED_B64}==" ;;
            3) CLEANED_B64="${CLEANED_B64}=" ;;
            0) ;;
            *) echo "Invalid Base64 secret length"; exit 1 ;;
          esac
          printf '%s' "$CLEANED_B64" | base64 --decode > "$RUNNER_TEMP/wow-release.jks"
          chmod 600 "$RUNNER_TEMP/wow-release.jks"
          test -s "$RUNNER_TEMP/wow-release.jks"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        working-directory: android
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/wow-release.jks"
          test -f "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed packages
        working-directory: android
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          echo "Debug APK: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          echo "Signed Release APK: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"
          echo "Signed Release AAB: $(du -h app/build/outputs/bundle/release/app-release.aab | cut -f1)"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: wow-native-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/wow-release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-native-v1.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             android/app/build/outputs/apk/debug/app-debug.apk             android/app/build/outputs/apk/release/app-release.apk             android/app/build/outputs/bundle/release/app-release.aab             --repo "${GITHUB_REPOSITORY}"             --title "WOW Native Android v1.1.${GITHUB_RUN_NUMBER}"             --notes "Native Android/Gradle build. No Expo or EAS is used."
