name: Admin Dashboard Build

on:
  workflow_dispatch:
  push:
    paths:
      - "admin/**"
      - "supabase/migrations/**"
      - ".github/workflows/admin.yml"

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://npytwojnxsmxhcssajtg.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_s9DgcPj_TJh-ZbVhPqgnvw_opH6Z5ww' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package.json
      - name: Install
        run: npm install
      - name: Verify Supabase configuration
        run: |
          set -e
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          echo "Supabase configuration: OK"
      - name: Build
        run: npm run build
      - name: Verify admin bundle contains Supabase configuration
        run: |
          set -e
          test -d dist
          grep -R -F -q -- "$VITE_SUPABASE_URL" dist
          grep -R -F -q -- "$VITE_SUPABASE_ANON_KEY" dist
      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-admin-dist-${{ github.run_number }}
          path: admin/dist
          if-no-files-found: error
          retention-days: 30
