name: Dashboard Responsive QA

on:
  workflow_dispatch:
  push:
    paths:
      - "web/public/dashboard/**"
      - ".github/workflows/dashboard-qa.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-responsive-qa
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory web/public > /tmp/wow-http.log 2>&1 &
          echo $! > /tmp/wow-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/dashboard/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wow-http.log
          exit 1

      - name: Run dashboard viewport QA
        run: |
          cat > /tmp/dashboard-responsive-qa.mjs <<'EOF'
          import { chromium } from 'playwright';

          const viewports = [
            { name: 'mobile-320', width: 320, height: 800 },
            { name: 'mobile-360', width: 360, height: 800 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'mobile-430', width: 430, height: 932 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'tablet-900', width: 900, height: 1100 },
            { name: 'desktop-1024', width: 1024, height: 900 },
            { name: 'desktop-1280', width: 1280, height: 900 }
          ];

          const screens = [
            'overview', 'settings', 'theme', 'ads', 'seo', 'content',
            'categories', 'app', 'files', 'studio', 'github', 'templates', 'history'
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          for (const viewport of viewports) {
            const page = await browser.newPage({ viewport });
            page.on('pageerror', error => {
              failures.push(viewport.name + ': pageerror: ' + error.message);
            });

            await page.goto('http://127.0.0.1:4173/dashboard/index.html', {
              waitUntil: 'networkidle'
            });

            await page.evaluate(() => {
              document.getElementById('auth')?.classList.add('hidden');
              const app = document.getElementById('app');
              app?.classList.remove('hidden');
              document.documentElement.style.overflowX = 'hidden';
              document.body.style.overflowX = 'hidden';
            });

            for (const screen of screens) {
              await page.evaluate((screen) => {
                document.querySelectorAll('.tab').forEach(el => {
                  el.classList.add('hidden');
                });
                const target = document.getElementById('tab-' + screen);
                target?.classList.remove('hidden');
                document.querySelectorAll('#nav button').forEach(btn => {
                  btn.classList.toggle('active', btn.dataset.tab === screen);
                });
                const title = document.getElementById('pageTitle');
                if (title) title.textContent = screen;
              }, screen);

              await page.waitForTimeout(80);

              const result = await page.evaluate(() => {
                const vw = document.documentElement.clientWidth;
                const scrollWidth = document.documentElement.scrollWidth;
                const allowed = new Set([
                  'code-editor', 'fm-editor', 'studio-editor', 'github-editor',
                  'github-tree', 'fm-tree', 'table-wrap', 'preview-frame'
                ]);

                const offenders = [];
                for (const el of document.querySelectorAll('#app *')) {
                  if (!(el instanceof HTMLElement)) continue;
                  const style = getComputedStyle(el);
                  if (style.display === 'none' || style.visibility === 'hidden') continue;
                  const rect = el.getBoundingClientRect();
                  if (rect.width <= 0 || rect.height <= 0) continue;
                  const className = typeof el.className === 'string' ? el.className : '';
                  const exempt = [...allowed].some(token => className.includes(token));
                  if (!exempt && rect.right > vw + 2) {
                    offenders.push({
                      tag: el.tagName,
                      id: el.id,
                      className: className.slice(0, 120),
                      right: Math.round(rect.right),
                      viewport: vw
                    });
                    if (offenders.length >= 8) break;
                  }
                }

                return {
                  viewport: vw,
                  scrollWidth,
                  horizontalOverflow: scrollWidth > vw + 1,
                  offenders
                };
              });

              if (result.horizontalOverflow || result.offenders.length) {
                failures.push(
                  viewport.name + '/' + screen +
                  ': overflow=' + result.horizontalOverflow +
                  ', scrollWidth=' + result.scrollWidth +
                  ', viewport=' + result.viewport +
                  ', offenders=' + JSON.stringify(result.offenders)
                );
              }
            }

            await page.close();
          }

          await browser.close();

          if (failures.length) {
            console.error('Responsive QA failures:');
            for (const failure of failures) console.error(' - ' + failure);
            process.exit(1);
          }

          console.log(
            'Responsive QA passed: ' + screens.length +
            ' dashboard screens × ' + viewports.length + ' viewports.'
          );
          EOF
          node /tmp/dashboard-responsive-qa.mjs

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/wow-http.pid ]; then
            kill "$(cat /tmp/wow-http.pid)" || true
          fi
