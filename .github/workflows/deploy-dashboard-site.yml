name: Deploy Dashboard Site
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [supabase_content_changed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://tqmjueqdfdyhiukhbant.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_xfJu5T9gZ4UsysK6LxWcFQ_FkG6nmbh' }}
          NEXT_PUBLIC_ISLAMWAY_API_URL: https://quranapi.islamway.net
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://gpldroid.github.io/quran-karim' }}
          NEXT_PUBLIC_BASE_PATH: /quran-karim
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
