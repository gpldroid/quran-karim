name: Deploy Web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-dashboard-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-web-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            npm-web-${{ runner.os }}-
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify Supabase target
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          EXPECTED_HOST="tqmjueqdfdyhiukhbant.supabase.co"
          ACTUAL_HOST="$(node -e 'console.log(new URL(process.env.SUPABASE_URL).hostname)')"
          test "$ACTUAL_HOST" = "$EXPECTED_HOST"
          HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30             --header "apikey: $SUPABASE_ANON_KEY"             --header "Authorization: Bearer $SUPABASE_ANON_KEY"             "$SUPABASE_URL/rest/v1/admin_users?select=user_id&limit=1")"
          test "$HTTP_STATUS" -ge 200
          test "$HTTP_STATUS" -lt 400
          echo "Supabase target and public.admin_users endpoint verified."

      - name: Build static Next.js export
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /quran-karim
        run: npm run build
      - name: Verify static export
        working-directory: apps/web
        run: |
          test -d out
          test -f out/index.html
          test -f out/404.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
