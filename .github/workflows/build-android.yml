name: Build Android Release
on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: "2.0.0"
      version_code:
        description: Android version code
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Configure Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="2.0.$GITHUB_RUN_NUMBER"
            VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: apps/android/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          gradle :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find apps/android/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: quran-karim-${{ steps.version.outputs.version_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" --repo "$GITHUB_REPOSITORY" --title "Quran Karim $TAG" --generate-notes
          fi
          RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
      - name: Update Supabase app_builds
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          APK_FILENAME: ${{ steps.apk.outputs.filename }}
          GITHUB_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_RELEASE_ID" ]; then GITHUB_RELEASE_ID=0; fi
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_FILENAME"
          RELEASE_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          curl --fail-with-body --retry 4 --retry-delay 3 --max-time 30 \
            --request POST \
            --url "$SUPABASE_URL/rest/v1/app_builds?on_conflict=version_code" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$(jq -n \
              --argjson version_code "$VERSION_CODE" \
              --arg version_name "$VERSION_NAME" \
              --arg release_tag "$RELEASE_TAG" \
              --arg release_url "$RELEASE_URL" \
              --arg download_url "$DOWNLOAD_URL" \
              --arg release_date "$RELEASE_DATE" \
              --argjson github_release_id "$GITHUB_RELEASE_ID" \
              --argjson github_run_id "$GITHUB_RUN_ID" \
              '{version_code:$version_code,version_name:$version_name,release_tag:$release_tag,release_url:$release_url,download_url:$download_url,release_date:$release_date,github_release_id:$github_release_id,github_run_id:$github_run_id}')"
