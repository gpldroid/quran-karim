name: System Health
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase health
        env:
          URL: https://tqmjueqdfdyhiukhbant.supabase.co/functions/v1/health
        run: curl --fail-with-body --retry 3 --max-time 20 "$URL"
      - name: Check Islamway
        run: curl --fail-with-body --retry 3 --max-time 20 https://quranapi.islamway.net/readers
      - name: Check GitHub latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo "$GITHUB_REPOSITORY"
      - name: Notify Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$WEBHOOK" -H "content-type: application/json"             -d '{"content":"Quran Dashboard health check failed: '"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'"}'
      - name: Notify Telegram
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage"             --data-urlencode "chat_id=$CHAT"             --data-urlencode "text=Quran Dashboard health check failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
