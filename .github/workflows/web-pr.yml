name: Web Build Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-pr.yml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /wow
          NEXT_PUBLIC_SUPABASE_URL: https://npytwojnxsmxhcssajtg.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_s9DgcPj_TJh-ZbVhPqgnvw_opH6Z5ww
        run: npm run build
