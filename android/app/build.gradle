plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "com.gpldroid.wow"
    compileSdk 36

    defaultConfig {
        applicationId "com.gpldroid.wow"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.1.0"
        buildConfigField "String", "SUPABASE_URL", "\"" + (System.getenv("SUPABASE_URL") ?: "") + "\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"" + (System.getenv("SUPABASE_ANON_KEY") ?: "") + "\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath == null || keystorePath.trim().isEmpty()) {
                throw new GradleException("ANDROID_KEYSTORE_PATH is required for a signed release build")
            }
            storeFile file(keystorePath)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    dependencies {
        // Supabase Realtime/PostgREST official Kotlin client.
        // 2.x used Ktor 2; current supabase-kt 3.x requires Ktor 3.
        implementation("io.github.jan-tennert.supabase:realtime-kt:3.2.6")
        implementation("io.github.jan-tennert.supabase:postgrest-kt:3.2.6")
        implementation("io.ktor:ktor-client-android:3.3.0")
        implementation("io.ktor:ktor-client-websockets:3.3.0")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
        coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../web/public"]
        }
    }
}
