<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="من نحن - موقع القرآن الكريم"><title>من نحن - القرآن الكريم</title><style>
:root{--p:#1b5e20;--s:#2e7d32;--bg:#f7faf7;--card:#fff;--text:#243126}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.9}.wrap{max-width:850px;margin:auto;padding:24px}.top{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:18px;border-radius:18px;margin-bottom:20px}.top a{color:#fff;text-decoration:none}.card{background:var(--card);padding:26px;border-radius:18px;box-shadow:0 8px 25px #00000012}h1{margin-top:0;color:var(--p)}a.btn{display:inline-block;background:var(--p);color:#fff;padding:10px 18px;border-radius:12px;text-decoration:none}</style></head><body><main class="wrap"><header class="top"><a href="./index.html">القرآن الكريم</a></header><article class="card"><h1>من نحن</h1><p>موقع القرآن الكريم منصة بسيطة لقراءة القرآن الكريم والاستماع إلى التلاوات وتسهيل الوصول إلى السور والآيات من الهاتف والويب.</p><p>نركز على واجهة واضحة وسريعة، مع حفظ تفضيلات القراءة على جهازك دون الحاجة إلى إنشاء حساب لاستخدام أدوات القرآن الأساسية.</p><p><a class="btn" href="./index.html">العودة إلى القرآن</a></p></article></main></body></html>
