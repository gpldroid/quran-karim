<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قراءة القرآن الكريم | WOW</title>
<meta name="description" content="قراءة القرآن الكريم مع سور القرآن كاملة، الترجمة والتفسير الميسر.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./runtime-config.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div data-ad-placement="header" class="config-ad-slot" hidden></div>
<div class="container">
  <div data-ad-placement="body_top" class="config-ad-slot" hidden></div>
  <div class="main-title">
    <h1>القرآن الكريم</h1>
    <div class="subtitle">قراءة المصحف مع اختيار السورة وعرض الترجمة والتفسير الميسر.</div>
  </div>
  <div id="quran-container">
    <div class="playlist-section">
      <div class="playlist-title"><i class="fas fa-list-ul"></i><span>سور القرآن الكريم (114 سورة)</span></div>
      <div id="quran-playlist"><div class="lyrics-placeholder">جاري تحميل السور...</div></div>
    </div>
  </div>
  <div class="lyrics-section">
    <div class="lyrics-header">
      <div class="lyrics-title"><i class="fas fa-book-open"></i><span>النص القرآني</span></div>
      <div class="current-surah" id="currentSurahName">الفاتحة</div>
    </div>
    <div class="surah-info" id="surahInfo">
      <div><span>عدد الآيات:</span><span id="versesCount">7</span></div>
      <div><span>النوع:</span><span id="surahType">مكية</span></div>
      <div><span>ترتيب النزول:</span><span id="revelationOrder">5</span></div>
    </div>
    <div class="text-controls">
      <button class="text-btn active" id="btnArabic"><i class="fas fa-font"></i> النص العربي</button>
      <button class="text-btn" id="btnTranslation"><i class="fas fa-language"></i> الترجمة</button>
      <button class="text-btn" id="btnTafsir"><i class="fas fa-book"></i> التفسير الميسر</button>
    </div>
    <div class="loader" id="lyricsLoader"><div class="spinner"></div><p>جاري تحميل النص القرآني...</p></div>
    <div id="lyrics-content"><div class="lyrics-placeholder"><i class="fas fa-quran" style="font-size:3rem;margin-bottom:15px;display:block;color:#cbd5e0;"></i>اختر سورة من القائمة لعرض نصها الكريم</div></div>
  </div>
</div>
<div data-ad-placement="body_bottom" class="config-ad-slot" hidden></div>
<script src="./quran-read.js"></script>
<script src="./app.js"></script>
</body>
</html>
